<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>HTML5 - CSS</title>
</head>
<body>
    <!-- 
    HTML5 không phân biệt hoa và thường , 
    semantic tags (ngữ nghĩa) : các thẻ đại diện các
    thành phần layout (bố cục trang ) trên web ,
    - header : đại diện cho phần đầu trang web
    - nav : đại diện cho phần menu điều hướng
    -article(chiếm 80% bài viết ),aside(chiếm 20%
    ở bên trái hoặc bên phải), footer(chân trang)
    -->
    <header>
        <!-- <h6>Tiêu đề trang</h6>
        <spaN>Logo nhỏ</span>
        <span>Slogan của trang web</span> -->
        <marquee>học để thay đổi</marquee>
    </header>
    <nav>
        <img src="" alt="">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
            <li><a href="#">bài viết</a></li>
            <li><a href="#">cài đặt</a></li>
        </ul>
    </nav>
    <main>
        <!--  Chứa nội dung chính của trang web -->
        <article>
            <!-- Chứa một bài việt,tin tức 80% -->
        </article>
        <aside>
            <!--  Chứa nội dung liên quan  20% -->
        </aside>
    </main>
    <footer>
        <!-- chân trang: chứa thông tin về 
         tác giả , bản ,liên hệ,link,liên kết,v.v...... -->
    </footer>

</body>
</html>
